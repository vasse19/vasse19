  <script>
    const B = 60 / 128;
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#bd-glow-fill", { opacity: 0.08, scale: 0.85 }, { opacity: 0.85, scale: 1.15, duration: 1.75, ease: "power2.in" }, 0);

    // per word from grey to white, no position change

    tl.fromTo("#bd-slot", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, 0.1);

    // slot machine: rolls accelerate with the snare roll and land on beat 3
    const steps = 10, t0 = 0.22, t1 = 3 * B;
    for (let k = 1; k <= steps; k++) {
      const at = t0 + (t1 - t0) * Math.pow((k - 1) / (steps - 1), 0.62);
      const next = k < steps ? t0 + (t1 - t0) * Math.pow(k / (steps - 1), 0.62) : at + 0.2;
      const last = k === steps;
      tl.to("#bd-strip", {
        y: -170 * k,
        duration: last ? 0.22 : Math.min(0.09, (next - at) * 0.8),
        ease: last ? "back.out(1.6)" : "power2.out",
      }, at);
    }
    tl.fromTo("#bd-slot", { scale: 1 }, { scale: 1.08, duration: 0.12, ease: "expo.out" }, t1);
    tl.to("#bd-slot", { scale: 1, duration: 0.25, ease: "power2.out" }, t1 + 0.12);

    tl.fromTo("#bd-flash-fill", { opacity: 0 }, { opacity: 1, duration: 0.11, ease: "power2.in" }, 1.76);
    window.__timelines["build"] = tl;
