  <script>
    const B = 60 / 128;
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#cn-flash-fill", { opacity: 1 }, { opacity: 0, duration: 0.28, ease: "power2.out" }, 0);
    // alternate the settle so consecutive cuts don't repeat the same move
    const moves = [
      { scale: 1.22 }, { scale: 1.12, x: 60 }, { scale: 1.12, x: -60 },
      { scale: 1.3, rotation: -2 }, { scale: 1.12, y: 80 }, { scale: 1.18, rotation: 2 },

      tl.fromTo("#cn-s" + (i + 1), from, { scale: 1, x: 0, y: 0, rotation: 0, duration: 0.42, ease: "expo.out" }, i * B);
    });
    tl.fromTo("#cn-lab .cn-label", { opacity: 0, filter: "blur(8px)", x: -20 },
      { opacity: 1, filter: "blur(0px)", x: 0, duration: 0.16, ease: "power3.out" }, 0.1);
    tl.to("#cn-lab .cn-label", { opacity: 0, filter: "blur(6px)", duration: 0.12, ease: "power2.in" }, 2.55);
    // whip up into the reel
    tl.to("#cn-stage", { y: -1600, filter: "blur(18px)", duration: 0.17, ease: "power3.in" }, 6 * B - 0.17);
    window.__timelines["cine"] = tl;
