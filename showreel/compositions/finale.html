  <script>
    // spark burst from the logo's centre, seeded
    (function () {
      let s = 11;
      const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
      const box = document.getElementById("fn-sparks");
      for (let i = 0; i < 46; i++) {
        const d = document.createElement("div");
        d.className = "fn-spark";
        d.id = "fn-spark-" + i;
        const a = (i / 46) * Math.PI * 2 + rnd() * 0.3;
        const r = 260 + rnd() * 520;
        d.dataset.x = (Math.cos(a) * r).toFixed(1);
        d.dataset.y = (Math.sin(a) * r * 0.75 + 60 + rnd() * 80).toFixed(1);
        d.dataset.s = (0.6 + rnd() * 1.6).toFixed(2);
        box.appendChild(d);
      }
    })();

    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#fn-flash-fill", { opacity: 1 }, { opacity: 0, duration: 0.28, ease: "power2.out" }, 0);

    // the slam: lands in 0.3 s, then is dead still
    tl.fromTo("#fn-logo-box", { scale: 2.4, opacity: 0, filter: "blur(22px)" },
      { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 0);
    // camera shake on impact, decaying
    const shake = [[14, -10], [-12, 8], [9, 6], [-6, -5], [4, 3], [-2, 2], [0, 0]];
    shake.forEach(([x, y], i) => tl.to("#fn-cam", { x, y, duration: 0.045, ease: "none" }, 0.04 + i * 0.045));

    tl.fromTo("#fn-wave", { scale: 0.3, opacity: 1 }, { scale: 5, opacity: 0, duration: 0.75, ease: "expo.out" }, 0.03);
    gsap.utils.toArray("#fn-sparks .fn-spark").forEach((d) => {
      tl.fromTo(d, { x: 0, y: 0, scale: Number(d.dataset.s), opacity: 1 },
        { x: Number(d.dataset.x), y: Number(d.dataset.y), duration: 1.3, ease: "expo.out" }, 0.03);
      tl.to(d, { opacity: 0, duration: 0.5, ease: "power1.in" }, 0.75);
    });

    // light rays: a slow constant orbit behind the mark
    tl.fromTo("#fn-rays", { rotation: 0, opacity: 0 }, { rotation: 22, opacity: 1, duration: 3.75, ease: "none" }, 0);

    // shine sweep across the gold
    tl.fromTo("#fn-shine-band", { x: -300 }, { x: 800, duration: 0.7, ease: "power2.inOut" }, 0.85);

    // lockup: per word blur-in, then the services line
    tl.fromTo("#fn-line-1 span", { opacity: 0, filter: "blur(8px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power2.out", stagger: 0.07 }, 1.5);
    tl.fromTo("#fn-line-2", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 1.72);
    window.__timelines["finale"] = tl;
  </script>
